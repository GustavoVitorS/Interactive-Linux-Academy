name: Validate static academy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate project data and structure
        run: python3 tools/validate_project.py
      - name: Validate documentation registry offline
        run: python3 tools/check_references.py --offline
      - name: Verify generated bundle is current
        run: python3 tools/build_bundle.py --check
      - name: Syntax-check JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find assets/js/core assets/js/features assets/js/data -name '*.js' -print0)
          node --check assets/js/bundle.js
